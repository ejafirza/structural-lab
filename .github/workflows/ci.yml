name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu = case-sensitive filesystem: catches any import-casing regressions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies — no install step by design
      - run: node --test
