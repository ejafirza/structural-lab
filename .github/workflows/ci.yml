name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu = case-sensitive filesystem: catches any import-casing regressions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies — no install step by design
      - run: node --test
