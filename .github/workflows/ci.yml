name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu = case-sensitive filesystem: catches any import-casing regressions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies — no install step by design
      - run: node --test
