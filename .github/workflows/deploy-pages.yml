# Deploy the live demo to GitHub Pages.
#
# The app is pure static files + ES modules with zero dependencies. Stage the
# project folders unchanged: ui/app.js imports ../src/analysis.js, so flattening
# ui/ would break those imports. The root index sends visitors to ./ui/.
#
# One-time setup (repo owner): Settings → Pages → Build and deployment →
# Source: "GitHub Actions" before the first deployment can succeed.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Guard: run the unit suite before publishing anything.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --test

      - name: Stage site (preserve ui/ and src/ paths)
        run: |
          mkdir -p site
          cp -r ui site/ui
          cp -r src site/src
          cp index.html site/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
