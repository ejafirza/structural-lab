# Deploy the live demo to GitHub Pages.
#
# The app is pure static files + ES modules with zero dependencies. Stage the
# project folders unchanged: ui/app.js imports ../src/analysis.js, so flattening
# ui/ would break those imports. The root index sends visitors to ./ui/.
#
# One-time setup (repo owner): Settings → Pages → Build and deployment →
# Source: "GitHub Actions" before the first deployment can succeed.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Guard: run the unit suite before publishing anything.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test

      - name: Stage site (preserve ui/ and src/ paths)
        run: |
          mkdir -p site
          cp -r ui site/ui
          cp -r src site/src
          cp index.html site/index.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
